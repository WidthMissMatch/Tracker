<style>/* RASO Mission Control — Tactical dark theme */
:root {
  --bg-0: #06080d;
  --bg-1: #0b0f17;
  --bg-2: #11161f;
  --bg-3: #181e2a;
  --line-0: #1c2433;
  --line-1: #2a3447;
  --line-2: #3a465e;
  --ink-0: #e8edf5;
  --ink-1: #b6c1d4;
  --ink-2: #7a8699;
  --ink-3: #4d5872;
  --accent: #6df2ff;        /* cyan — ground truth */
  --accent-soft: #2bb8cc;
  --warn: #ffb663;          /* orange — prediction */
  --warn-soft: #b97a3c;
  --good: #7be39a;          /* green — low error */
  --bad: #ff6868;           /* red — high error */
  --violet: #b58cff;        /* IMM bank */
  --grid: rgba(108, 130, 170, 0.07);
  --grid-strong: rgba(108, 130, 170, 0.15);
  --mono: 'JetBrains Mono', 'IBM Plex Mono', 'Menlo', 'Consolas', monospace;
  --sans: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
}

* { box-sizing: border-box; }
html, body, #root { margin: 0; padding: 0; height: 100%; background: var(--bg-0); color: var(--ink-1); font-family: var(--sans); overflow: hidden; }
body { -webkit-font-smoothing: antialiased; }

.mono { font-family: var(--mono); font-feature-settings: 'tnum'; }
.tnum { font-variant-numeric: tabular-nums; font-feature-settings: 'tnum'; }

/* App shell */
.app {
  display: grid;
  grid-template-columns: 180px 1fr 240px;
  grid-template-rows: 42px 1fr 60px;
  grid-template-areas:
    "topbar topbar topbar"
    "left   stage  right"
    "bottom bottom bottom";
  height: 100vh;
  width: 100vw;
  background: var(--bg-0);
  position: relative;
}

.topbar { grid-area: topbar; }
.left   { grid-area: left; }
.stage  { grid-area: stage; position: relative; overflow: hidden; }
.right  { grid-area: right; }
.bottom { grid-area: bottom; }

/* Topbar */
.topbar {
  display: flex; align-items: stretch;
  background: linear-gradient(180deg, #0a0e16 0%, #060810 100%);
  border-bottom: 1px solid var(--line-0);
  padding: 0 14px;
  gap: 18px;
}
.brand { display: flex; align-items: center; gap: 10px; padding-right: 18px; border-right: 1px solid var(--line-0); }
.brand-mark {
  width: 26px; height: 26px; border-radius: 6px;
  background: radial-gradient(circle at 30% 30%, #1a3550 0%, #0a1422 70%);
  border: 1px solid #1d3756;
  position: relative;
  display: grid; place-items: center;
}
.brand-mark::before {
  content: ''; width: 12px; height: 12px; border-radius: 999px;
  border: 1.5px solid var(--accent); box-shadow: 0 0 8px rgba(109, 242, 255, 0.4);
}
.brand-mark::after {
  content: ''; width: 4px; height: 4px; border-radius: 999px;
  background: var(--accent); position: absolute;
  box-shadow: 0 0 6px rgba(109, 242, 255, 0.9);
}
.brand-text { font-size: 12px; line-height: 1.1; letter-spacing: 0.02em; }
.brand-text .t1 { color: var(--ink-0); font-weight: 600; }
.brand-text .t2 { color: var(--ink-2); font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; }

.tb-section { display: flex; align-items: center; gap: 10px; }
.tb-spacer { flex: 1; }
.tb-stat { display: flex; flex-direction: column; padding: 0 12px; border-right: 1px solid var(--line-0); }
.tb-stat .lbl { font-size: 9px; color: var(--ink-3); letter-spacing: 0.14em; text-transform: uppercase; line-height: 1; padding-bottom: 4px; }
.tb-stat .val { font-family: var(--mono); font-size: 13px; color: var(--ink-0); line-height: 1; font-variant-numeric: tabular-nums; }
.tb-stat .val.accent { color: var(--accent); }
.tb-stat .val.warn { color: var(--warn); }

.live-pill {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 10px; border-radius: 999px;
  font-family: var(--mono); font-size: 10px; letter-spacing: 0.14em;
  text-transform: uppercase;
  background: rgba(123, 227, 154, 0.08); color: var(--good);
  border: 1px solid rgba(123, 227, 154, 0.25);
}
.live-pill.paused { background: rgba(255, 182, 99, 0.08); color: var(--warn); border-color: rgba(255, 182, 99, 0.3); }
.live-pill .dot { width: 6px; height: 6px; border-radius: 999px; background: currentColor; box-shadow: 0 0 6px currentColor; animation: pulse 1.4s ease-in-out infinite; }
.live-pill.paused .dot { animation: none; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }

/* Left rail — segments + class */
.left {
  background: var(--bg-1); border-right: 1px solid var(--line-0);
  display: flex; flex-direction: column; overflow: hidden;
}
.panel-head {
  padding: 14px 14px 8px; border-bottom: 1px solid var(--line-0);
  display: flex; align-items: center; justify-content: space-between;
}
.panel-head .ttl { font-size: 10px; letter-spacing: 0.18em; color: var(--ink-2); text-transform: uppercase; font-weight: 600; }
.panel-head .ct { font-family: var(--mono); font-size: 10px; color: var(--ink-3); }

.seg-list { flex: 1; overflow-y: auto; padding: 6px; }
.seg-list::-webkit-scrollbar { width: 6px; }
.seg-list::-webkit-scrollbar-thumb { background: var(--line-1); border-radius: 3px; }

.seg-item {
  display: grid;
  grid-template-columns: 24px 1fr auto;
  gap: 8px; align-items: center;
  padding: 7px 8px;
  border-radius: 5px;
  cursor: pointer;
  margin-bottom: 2px;
  border: 1px solid transparent;
  transition: background 0.12s;
